name: Reviewed release
on:
  workflow_dispatch:
    inputs:
      reviewed_sha:
        description: Exact reviewed main commit (40 lowercase hex characters)
        type: string
        required: true
      tag:
        description: Existing immutable vX.Y.Z tag on that commit
        type: string
        required: true
permissions:
  contents: read
  actions: read
  statuses: read
env:
  INDEPENDENT_REVIEW_PRODUCER_ID: ${{ vars.INDEPENDENT_REVIEW_PRODUCER_ID }}
concurrency:
  group: reviewed-release
  cancel-in-progress: false
jobs:
  sign:
    name: Sign reviewed main only
    if: github.ref == 'refs/heads/main'
    environment: release-signing
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      REVIEWED_SHA: ${{ inputs.reviewed_sha }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Gate source before loading signing secrets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/release-gate.py "$REVIEWED_SHA" "$RELEASE_TAG"
      - name: Verify official Gradle wrapper before execution
        run: python3 scripts/ci/verify-gradle-wrapper.py
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - name: Build and verify preserved production signer
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          REWARDS_NFC_KEYSTORE_PASSWORD: ${{ secrets.REWARDS_NFC_KEYSTORE_PASSWORD }}
          REWARDS_NFC_KEY_ALIAS: ${{ secrets.REWARDS_NFC_KEY_ALIAS }}
          REWARDS_NFC_KEY_PASSWORD: ${{ secrets.REWARDS_NFC_KEY_PASSWORD }}
          ANDROID_RELEASE_CERT_SHA256: ${{ vars.ANDROID_RELEASE_CERT_SHA256 }}
          GITHUB_SHA: ${{ inputs.reviewed_sha }}
        run: bash scripts/ci/sign-release.sh "$RELEASE_TAG"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reviewed-signed-release
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 7
  github:
    name: Approve GitHub publication
    needs: sign
    environment: release-publication
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
      statuses: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: reviewed-signed-release
          path: release-artifacts/
      - name: Recheck exact main and publish without replacement
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEWED_SHA: ${{ inputs.reviewed_sha }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: bash scripts/ci/publish-github.sh "$REVIEWED_SHA" "$RELEASE_TAG"
